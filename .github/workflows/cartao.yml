name: Cartão do perfil

# Regera o cartão todos os dias. O que muda é o "Uptime", que avança uma vez
# por mês; nos outros dias não há diferença e não se faz commit nenhum.
on:
  schedule:
    - cron: "0 6 * * *"   # 03:00 em São Paulo
  workflow_dispatch:       # botão "Run workflow" para gerar na hora
  push:
    paths:
      - gerar_cartao.py
      - .github/workflows/cartao.yml

permissions:
  contents: write          # só para fazer commit dos SVGs neste repositório

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Sem token: o cartão já não tem estatísticas do GitHub, que eram o
      # único motivo para ler os repositórios privados. O gerador só usa a
      # biblioteca padrão do Python e não acede à rede.
      - name: Gerar os SVGs
        run: python gerar_cartao.py

      - name: Commit se o cartão mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --cached --quiet || git commit -m "chore: atualiza cartão do perfil"
          git push
